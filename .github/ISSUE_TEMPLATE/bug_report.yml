name: Bug report
description: Report a reproducible TriSync problem.
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Include TriSync, Blender, Unity, URP, and your operating system.
      placeholder: |
        TriSync:
        Blender:
        Unity:
        URP:
        Operating system:
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the smallest sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or example
      description: Include relevant errors, screenshots, or a small example you can share.
